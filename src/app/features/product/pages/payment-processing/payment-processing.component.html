<div class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
    <div class="card shadow-lg p-5 text-center" style="max-width: 500px; width: 100%;">

        <div *ngIf="isProcessing; else resultTemplate">
            <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h3 class="fw-bold text-dark mb-2">Please wait</h3>
            <p class="text-muted mb-4">{{ statusMessage }}</p>
            <div class="progress" style="height: 5px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                    style="width: 100%"></div>
            </div>
        </div>

        <ng-template #resultTemplate>
            <div class="mb-4">
                <i class="bi bi-info-circle-fill text-warning" style="font-size: 4rem;"></i>
            </div>
            <h4 class="fw-bold mb-3">Action Required</h4>
            <p class="text-muted">{{ statusMessage }}</p>

            <div class="d-grid gap-2 mt-4">
                <a routerLink="/u/orders" class="btn btn-primary btn-lg">Go to My Orders</a>
                <a routerLink="/" class="btn btn-outline-secondary">Return Home</a>
            </div>
        </ng-template>

    </div>
</div>
