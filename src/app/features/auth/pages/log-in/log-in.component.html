<div class="container d-flex justify-content-center align-items-center my-4">
  <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" formControlName="email" />
      </div>

      <!-- Password with show/hide -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control"
            placeholder="Enter your password" formControlName="password" />
          <button type="button" class="btn btn-secondary" (click)="showPassword = !showPassword">
            {{ showPassword ? 'HIDE' : 'SHOW' }}
          </button>
        </div>
      </div>

      <!-- Forgot password -->
      <div class="mb-3 text-center">
        <a href="#" class="text-decoration-none">Forgot your password?</a>
      </div>

      <!-- Sign in -->
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-dark" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'SIGN IN' }}
        </button>
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="text-danger text-center mb-3">
        {{ errorMessage }}
      </div>

      <!-- Divider -->
      <hr />

      <!-- Register link -->
      <div class="text-center">
        No account?
        <a routerLink="/auth/register" class="text-decoration-none">Create one here</a>
      </div>
    </form>
  </div>
</div>
